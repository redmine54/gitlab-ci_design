# .gitlab-ci/includes/stages/security/54_stage_security_common.yml # Dependency/Trivy/ZAP/Secret Scan・Security Gate
# ==================================================
# ID      : 54
# Name    : stage_security_common
# Version : 2.0
# File    : .gitlab-ci/includes/stages/security/54_stage_security_common.yml
# Purpose :
#   Dependency Scan
#   Secret Scan
#   Trivy Scan
#   OWASP ZAP Scan
#   Security Report
#   Security Gate
# ==================================================

# --------------------------------------
# Dependency Scan
# --------------------------------------

dependency_scan:

  stage: security

  allow_failure: true

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/security/dependency/

  script:

    - echo "===================================="
    - echo "Dependency Scan Started"
    - echo "APP_TYPE=${APP_TYPE}"
    - echo "===================================="

    - mkdir -p reports/security/dependency

    - |

      case "${APP_TYPE}" in

        tomcat|springboot|was|liberty)

          if command -v dependency-check.sh >/dev/null 2>&1
          then

            dependency-check.sh \
              --scan . \
              --out reports/security/dependency

          else

            echo "dependency-check.sh not installed"

          fi

          ;;

        nodejs)

          npm audit \
            --json \
            > reports/security/dependency/npm-audit.json \
            || true

          ;;

        python)

          pip-audit \
            -f json \
            > reports/security/dependency/pip-audit.json \
            || true

          ;;

        *)

          echo "Unsupported APP_TYPE=${APP_TYPE}"

          exit 1

          ;;

      esac

    - echo "Dependency Scan Finished"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# Secret Scan
# --------------------------------------

secret_scan:

  stage: security

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/security/secrets/

  script:

    - echo "===================================="
    - echo "Secret Scan Started"
    - echo "===================================="

    - mkdir -p reports/security/secrets

    - |

      grep -RniE \
      '(password|passwd|apikey|api_key|secret|token)' \
      . \
      > reports/security/secrets/findings.txt \
      || true

    - echo "Secret Scan Finished"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# Trivy Scan
# --------------------------------------

trivy_scan:

  stage: security

  allow_failure: true

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/security/trivy/

  script:

    - echo "===================================="
    - echo "Trivy Scan Started"
    - echo "===================================="

    - mkdir -p reports/security/trivy

    - |

      if command -v trivy >/dev/null 2>&1
      then

        trivy fs \
          . \
          --format json \
          --output reports/security/trivy/trivy.json \
          || true

      else

        echo "trivy not installed"

      fi

    - echo "Trivy Scan Finished"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# OWASP ZAP
# --------------------------------------

zap_scan:

  stage: security

  allow_failure: true

  needs:

    - e2e

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/security/zap/

  script:

    - echo "===================================="
    - echo "OWASP ZAP Started"
    - echo "===================================="

    - mkdir -p reports/security/zap

    - |

      if command -v zap-baseline.py >/dev/null 2>&1
      then

        zap-baseline.py \
          -t "${HEALTHCHECK_URL}" \
          -r reports/security/zap/report.html \
          || true

      else

        echo "zap-baseline.py not installed"

      fi

    - echo "OWASP ZAP Finished"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# Security Report Aggregate
# --------------------------------------

security_report:

  stage: security

  needs:

    - dependency_scan

    - secret_scan

    - trivy_scan

    - zap_scan

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/security/

  script:

    - echo "===================================="
    - echo "Security Report"
    - echo "===================================="

    - echo "Security Scan Completed" \
      > reports/security/security-summary.txt

    - echo "Pipeline=${CI_PIPELINE_ID}" \
      >> reports/security/security-summary.txt

    - echo "Date=$(date)" \
      >> reports/security/security-summary.txt

    - echo "Security Report Generated"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# Security Gate
# --------------------------------------

security_gate:

  stage: security

  needs:

    - dependency_scan

    - secret_scan

    - trivy_scan

    - zap_scan

    - security_report

  allow_failure: false

  script:

    - echo "===================================="
    - echo "Security Gate Started"
    - echo "===================================="

    - |

      if [ "${SECURITY_GATE_ENABLED}" != "true" ]
      then

        echo "Security Gate Disabled"

        exit 0

      fi

    - |

      if grep -Ri "CRITICAL" reports/security >/dev/null 2>&1
      then

        echo "CRITICAL vulnerability detected"

        exit 1

      fi

    - |

      if grep -Ri "HIGH" reports/security >/dev/null 2>&1
      then

        echo "HIGH vulnerability detected"

        exit 1

      fi

    - echo "Security Gate Passed"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'
