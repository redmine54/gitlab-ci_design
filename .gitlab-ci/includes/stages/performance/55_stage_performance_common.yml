# .gitlab-ci/includes/stages/performance/55_stage_performance_common.yml # k6性能試験・Performance Gate
# ==================================================
# ID      : 55
# Name    : stage_performance_common
# Version : 2.0
# File    : .gitlab-ci/includes/stages/performance/55_stage_performance_common.yml
# Purpose :
#   k6 Performance Test
#   Performance Report
#   Performance Gate
# ==================================================

# --------------------------------------
# Performance Test
# --------------------------------------

performance_test:

  stage: performance

  needs:

    - e2e

  allow_failure: true

  timeout: 60m

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/performance/

      - reports/k6/

  script:

    - echo "===================================="

    - echo "Performance Test Started"

    - echo "APP_NAME=${APP_NAME}"

    - echo "APP_TYPE=${APP_TYPE}"

    - echo "TARGET=${HEALTHCHECK_URL}"

    - echo "===================================="

    - mkdir -p reports/performance

    - mkdir -p reports/k6

    - |

      if ! command -v k6 >/dev/null 2>&1
      then

        echo "k6 not installed"

        exit 0

      fi

    - |

      if [ ! -f ".gitlab-ci/scripts/performance/99_k6_smoke.js" ]
      then

        cat > k6-smoke.js <<'EOF'
        import http from 'k6/http';
        import { sleep } from 'k6';

        export const options = {

          vus: 10,

          duration: '1m',

          thresholds: {

            http_req_failed: ['rate<0.01'],

            http_req_duration: ['p(95)<2000']

          }
        };

        export default function () {

          http.get(__ENV.TARGET_URL);

          sleep(1);

        }
        EOF

        export K6_SCRIPT=k6-smoke.js

      else

        export K6_SCRIPT=.gitlab-ci/scripts/performance/99_k6_smoke.js

      fi

    - |

      k6 run \
        --summary-export reports/k6/summary.json \
        --out json=reports/k6/result.json \
        "${K6_SCRIPT}" \
        -e TARGET_URL="${HEALTHCHECK_URL}" \
        || true

    - echo "Performance Test Finished"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# Performance Report
# --------------------------------------

performance_report:

  stage: performance

  needs:

    - performance_test

  artifacts:

    when: always

    expire_in: 30 days

    paths:

      - reports/performance/

      - reports/k6/

  script:

    - echo "===================================="

    - echo "Performance Report"

    - echo "===================================="

    - echo "Performance Test Completed" \
      > reports/performance/performance-summary.txt

    - echo "Pipeline=${CI_PIPELINE_ID}" \
      >> reports/performance/performance-summary.txt

    - echo "Application=${APP_NAME}" \
      >> reports/performance/performance-summary.txt

    - echo "Date=$(date)" \
      >> reports/performance/performance-summary.txt

    - echo "Performance Report Generated"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'

# --------------------------------------
# Performance Gate
# --------------------------------------

performance_gate:

  stage: performance

  needs:

    - performance_test

    - performance_report

  allow_failure: false

  script:

    - echo "===================================="

    - echo "Performance Gate Started"

    - echo "===================================="

    - |

      if [ "${PERFORMANCE_GATE_ENABLED}" != "true" ]
      then

        echo "Performance Gate Disabled"

        exit 0

      fi

    - |

      if [ ! -f reports/k6/summary.json ]
      then

        echo "Performance Result Missing"

        exit 1

      fi

    - |

      grep -q "http_req_duration" reports/k6/summary.json

    - |

      grep -q "http_req_failed" reports/k6/summary.json

    - echo "Performance Gate Passed"

  rules:

    - if: '$CI_COMMIT_BRANCH == "master"'

    - if: '$CI_COMMIT_TAG'
