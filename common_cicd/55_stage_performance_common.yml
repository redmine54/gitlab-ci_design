common-performance:
  stage: performance
  image:
    name: grafana/k6:0.55.0
    entrypoint: [""]
  rules:
    - if: '($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG) && $PERFORMANCE_SCENARIO'
      when: manual
  allow_failure: true
  script:
    - mkdir -p performance-report
    - k6 run --summary-export performance-report/summary.json "$PERFORMANCE_SCENARIO"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - performance-report/
