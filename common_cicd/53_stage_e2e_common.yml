common-e2e:
  stage: e2e
  image: $E2E_IMAGE
  rules:
    - if: '($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^feature\/.*/) && $START_CMD && $E2E_CMD && $E2E_IMAGE'
  dependencies:
    - common-backend-build
    - common-frontend-build
  script:
    - |
      sh -c "$START_CMD" > app.log 2>&1 &
      app_pid=$!
      trap 'kill "$app_pid" 2>/dev/null || true' EXIT

      if [ -n "$HEALTHCHECK_URL" ]; then
        attempt=0
        until node -e 'fetch(process.env.HEALTHCHECK_URL).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 30 ]; then
            cat app.log
            echo "Application did not become healthy: $HEALTHCHECK_URL" >&2
            exit 1
          fi
          sleep 2
        done
      fi

      if [ -n "$E2E_INSTALL_CMD" ]; then
        sh -c "$E2E_INSTALL_CMD"
      fi
      sh -c "$E2E_CMD"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app.log
      - playwright-report/
      - test-results/
